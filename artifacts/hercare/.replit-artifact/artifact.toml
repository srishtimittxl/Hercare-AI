kind = "mobile"
previewPath = "/"
title = "HerCare AI"
version = "1.0.0"
id = "artifacts/hercare"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24028

[services.development]
run = "pnpm --filter @workspace/hercare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hercare", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/hercare", "run", "serve" ]

[services.env]
PORT = "24028"
BASE_PATH = "/"
